name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-13
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - run: cargo build --release --target ${{ matrix.target }} --manifest-path server/Cargo.toml
      - name: package
        shell: bash
        run: |
          bin=nextedit-server
          if [[ "${{ matrix.target }}" == *windows* ]]; then bin=nextedit-server.exe; fi
          tar -czf "nextedit-server-${{ matrix.target }}.tar.gz" \
            -C "server/target/${{ matrix.target }}/release" "$bin"
      - uses: softprops/action-gh-release@v2
        with:
          files: nextedit-server-*.tar.gz
